# Kill test experiment config. The hyperparameter grid below is fixed BEFORE any real run
# (PHASE1 Section 7, Step 1). Thresholds live in configs/prereg_kill_test.yaml (never here).

prompts:
  test: configs/prompts/kill_test.json
  validation: configs/prompts/validation.json
  long: configs/prompts/long.json

# circuit-tracer defaults used for the exact default run (B0). The values are the CLI defaults of
# circuit-tracer 0.5.0 (__main__.py), which match PROJECT.md. The Python attribute() defaults differ
# (batch_size 512, max_feature_nodes None = no cap); we pass these values explicitly.
exact:
  max_n_logits: 10
  desired_logit_prob: 0.95
  max_feature_nodes: 7500
  batch_size: 256
  update_interval: 4
  node_threshold: 0.8
  edge_threshold: 0.98
  regime_f_time_budget_minutes: 30
  regime_f_prompts: first_of_each_category

seeds: [0, 1, 2]

cct_fast:  # merged over cct.pipeline.DEFAULT_CCT
  sensing: rademacher
  exact_logit_rows: true
  mask: true
  certify: {enabled: true, m_probe: 16, delta: 0.01}
  refine: {enabled: false}
  recovery: {device: cuda, dtype: float32, chunk: 1024, tol: 1.0e-6}
cct_certified:
  refine: {enabled: true}

# Step 1 grid, searched on the 4 validation prompts only, at every budget m of the prereg grid.
# Rule: the setting that meets the fidelity criteria on all 4 validation prompts at the smallest
# median cost. Ties: the first in the order listed.
# 54 settings x 5 budgets x 4 prompts x 3 seeds, about 3,200 simulated runs (about 1 GPU-hour
# estimated from the recovery flop count; measure at K0.5 and log).
grid:
  recovery.algo: [omp, cosamp, fista]
  recovery.k_max: [16, 32, 64]
  screening.q: [0.995, 0.999]
  hubs.rho_hub: [0.3]
  hubs.budget: [32, 128, 512]

budgets:
  cct_m: [64, 128, 256, 512, 1024]
  b1_rows: [64, 128, 256, 512, 1024, 2048, 4096, T_D]

k3:
  prompts: first_of_each_category
  repeats: 3

# ---- tiny run (P0 only; numbers meaningless) ----
tiny:
  model: {n_layers: 4, d_model: 32, n_heads: 2, d_head: 16, vocab: 64, d_mlp: 64, n_features: 64}
  transcoder_sets: [plt, clt]
  n_test: 8
  n_validation: 2
  n_long: 2
  prompt_lengths: [8, 12]
  long_lengths: [16, 20]
  max_feature_nodes: 150
  batch_size: 64
  cct_m: [16, 32, 64, 128]
  b1_rows: [16, 32, 64, 128, T_D]
  grid:
    recovery.algo: [omp, cosamp]
    recovery.k_max: [8, 16]
    screening.q: [0.995]
    hubs.rho_hub: [0.3]
    hubs.budget: [32, 128]
  recovery_device: cpu
  row_seconds: null   # measured on the tiny backend by sanity_k0.py
  kappa: null
