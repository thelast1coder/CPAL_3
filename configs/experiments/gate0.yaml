# Gate 0 (PROJECT_V2.md Section 7). Settings only; every decision threshold lives in
# configs/prereg_gate0.yaml (identical to the YAML block of PREREG_GATE0.md).
# Written before any real-model run.

seed: 0

# ---- G0-A: short prompts, Gemma-2-2B, PLT and CLT-426k -------------------------------------------
g0a:
  model_sets: [gemma2_2b_plt, gemma2_2b_clt426k]
  prompts_file: configs/prompts/kill_test.json
  prompt_ids: [kill_test_00, kill_test_04, kill_test_09]   # the 3 verified canonical prompts
  exact:                      # circuit-tracer CLI defaults, regime D (PHASE1 Section 5)
    max_feature_nodes: 7500
    batch_size: 256
    max_n_logits: 10
    desired_logit_prob: 0.95
    update_interval: 4
    node_threshold: 0.8
    edge_threshold: 0.98
  k07_rows: 256               # random target rows checked against the attention-detached backward
  truncation_budgets: [16, 32, 64, 96, 128, 192, 256, 384, 512, 768, 1024, 1536, 2048, 3072, 4096, 6144, T_D]
  sensing_m: [128, 256, 512, 1024]
  sensing_seeds: [0, 1, 2]
  cct:                        # merged over cct.pipeline.DEFAULT_CCT; sensing on A - A_0
    sensing: rademacher
    exact_logit_rows: true
    mask: true
    screening: {enabled: true, q: 0.995, safety: 2.0}
    recovery: {algo: omp, k_max: 32, device: cuda, dtype: float32, chunk: 1024, tol: 1.0e-6}
    hubs: {enabled: true, rho_hub: 0.3, budget: 128}
    certify: {enabled: false}
    refine: {enabled: false}
  timing_repeats: 3

# ---- G0-B: whole traces, Qwen3-1.7B (thinking), PLT ----------------------------------------------
g0b:
  model_set: qwen3_1p7b_plt
  problems_file: configs/prompts/gate0_traces.json
  traces_file: results/gate0/traces.json        # written once by scripts/gen_traces.py, then committed
  generation:
    enable_thinking: true
    do_sample: false          # greedy: deterministic given the weights
    max_new_tokens: 512
    dtype: float32
  n_traces: 2
  generated_tokens_range: [200, 300]
  fallback_generated_tokens_range: [150, 400]   # used only if fewer than n_traces fall in the range
  union:
    slots: 32                 # explained outputs n in {1, 2, 4, 8, 16, 32}, nested, answer always in
    levels: [1, 2, 4, 8, 16, 32]
    reference_budget: 8192
    convergence_budget: 4096
    convergence_jaccard: 0.95
    raised_budget: 16384      # used for an output whose reference fails the convergence check
    batch_size: 64            # long prefixes: smaller batch (memory); K0 confirms
    max_n_logits: 10
    desired_logit_prob: 0.95
    update_interval: 4
    node_threshold: 0.8
    edge_threshold: 0.98
    c_grid: [16, 32, 64, 96, 128, 192, 256, 384, 512, 768, 1024, 1536, 2048, 3072, 4096, 6144, 8192, 12288, 16384]
    time_budget_minutes: 60   # GPU phase; stop after the last complete level within this time
  columns:
    n_sources: 300
    strata_kinds: [feature, error, token]
    strata_positions: [first, early, middle, late]
    batch: 32                 # forward-mode tangents per pass
    forward_batch_size: 32    # batch of the operator's cached forward (rows are not needed here)
    taus: [1.0e-2, 1.0e-3, 1.0e-4]
    k07_rows: 64              # K0.7 on the trace: rows checked against the attention-detached backward
